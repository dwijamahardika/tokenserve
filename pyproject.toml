[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tokenserve"
version = "0.1.0"
description = "LLM inference server built around a continuous-batching scheduler and a paged KV-cache manager."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Faster event loop + HTTP parser. Recommended for benchmarks; not required.
speed = ["uvloop>=0.19; sys_platform != 'win32'", "httptools>=0.6"]
# Real CPU backend. Install torch from the CPU wheel index, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
hf = ["transformers>=4.56", "torch>=2.2"]
bench = ["httpx>=0.27"]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
tokenserve = "tokenserve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ASYNC", "PIE", "RET"]
ignore = [
  "RET504",  # assigning before return often reads better
  "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "bench", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "uvloop"]
ignore_missing_imports = true
